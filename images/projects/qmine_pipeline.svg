<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="QMine: real mining problem instances run the same ladder on every real engine, classical exact, field heuristics, quantum-inspired, gate-model simulators and credential-gated providers, with a money-denominated cost ledger; a verdict is computed per instance, and today the classical baseline usually wins">
  <defs>
    <linearGradient id="qmbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="qmar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#qmbg)"/>
  <text x="32" y="44" class="t" font-size="22">QMine</text>
  <text x="32" y="66" class="m">Quantum computing measured on real mining problems · every run in money, every skip explicit, every verdict computed</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">PROBLEMS</text>
  <text x="46" y="140" class="t" font-size="12">16 cases, 121 variants</text>
  <text x="46" y="158" class="m">six categories: pits,</text>
  <text x="46" y="172" class="m">dispatch, packing,</text>
  <text x="46" y="186" class="m">rostering, circuits</text>
  <text x="46" y="206" class="m">plus a flotation soft-sensor</text>
  <text x="46" y="220" class="m">prediction problem</text>
  <text x="46" y="244" class="warn" font-size="11">dataset-backed, seeded</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#qmar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">THE SAME LADDER, REAL ENGINES</text>
  <rect x="230" y="116" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Classical exact and field</text>
  <text x="242" y="150" class="m">CP-SAT · HiGHS · heuristics</text>
  <rect x="230" y="162" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="180" class="t" font-size="12">Quantum-inspired</text>
  <text x="242" y="196" class="m">SA · tabu · SQA · bifurcation</text>
  <rect x="230" y="208" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="226" class="t" font-size="12">Gate model and providers</text>
  <text x="242" y="242" class="m">QAOA variants · VQE · 11 gated lanes</text>
  <text x="230" y="268" class="m">3,255 declared cells; 1,631 explicit skips</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#qmar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">LEDGER + VERDICT</text>
  <text x="490" y="140" class="t" font-size="12">Cost in money per run</text>
  <text x="490" y="158" class="m">wall clock, gap to the</text>
  <text x="490" y="172" class="m">proven optimum</text>
  <text x="490" y="194" class="t" font-size="12">Verdict computed</text>
  <text x="490" y="210" class="m">from the measurements,</text>
  <text x="490" y="224" class="m">never written</text>
  <text x="490" y="248" class="m">replayed from traces</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">TODAY</text>
  <text x="654" y="138" class="m">problem-aware gate</text>
  <text x="654" y="152" class="m">variants reach the</text>
  <text x="654" y="166" class="m">optimum on tiny pits</text>
  <text x="654" y="186" class="m">packing: a tie, the</text>
  <text x="654" y="200" class="m">classical 3x faster</text>
  <text x="654" y="220" class="m">sensor: ridge beats</text>
  <text x="654" y="234" class="m">both quantum models</text>
  <text x="654" y="256" class="warn" font-size="11">no advantage claimed</text>

  <text x="32" y="316" class="m">Honesty spine, on screen per case: as of the research date no third-party-confirmed quantum advantage exists for any industrial optimization problem.</text>
  <text x="32" y="332" class="m">Two formulations without located prior art (truck dispatch, flotation circuit design); crew rostering recounted, with its production prior art recorded.</text>
  <text x="32" y="356" class="m">160 tests, four content guards; deployed as a service on the ML VPS behind an operator session; both browser gates re-run against the deployment.</text>
  <text x="32" y="380" class="warn" font-size="12">Private repository (provider credentials, a heavy engine stack); the public didactic counterpart is QLab. Lifecycle building, no adopter yet.</text>
</svg>
