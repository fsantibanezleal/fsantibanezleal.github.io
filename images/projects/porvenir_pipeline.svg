<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Porvenir: plant records and simulators feed a ladder of eleven rungs plus a zero-shot yardstick, from persistence to ensembled recurrent state-space models, every one scored per horizon against holding the last value; a world model takes the action sequence as an argument, which makes what-if, planning and regime detection expressible; on the real flotation record most learned rungs do not beat persistence">
  <defs>
    <linearGradient id="pvbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="pvar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}.bad{fill:#f06292}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#pvbg)"/>
  <text x="32" y="44" class="t" font-size="22">Porvenir</text>
  <text x="32" y="66" class="m">Learned world models for mineral processing · the action sequence is an argument, and the bar is holding the last value</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">RECORDS</text>
  <text x="46" y="140" class="t" font-size="12">Real and simulated</text>
  <text x="46" y="158" class="m">CC0 iron-ore flotation:</text>
  <text x="46" y="172" class="m">737,453 rows at 20 s,</text>
  <text x="46" y="186" class="m">hourly assay cadence</text>
  <text x="46" y="206" class="m">Tennessee Eastman archive</text>
  <text x="46" y="220" class="m">two in-house simulators</text>
  <text x="46" y="234" class="m">with ground truth</text>
  <text x="46" y="256" class="warn" font-size="11">10 of 13 cases baked</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#pvar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">THE LADDER (latentplant)</text>
  <rect x="230" y="116" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Persistence, the bar</text>
  <text x="242" y="150" class="m">seasonal naive · VARX</text>
  <rect x="230" y="162" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="180" class="t" font-size="12">Sequence models</text>
  <text x="242" y="196" class="m">GRU-D · DeepAR · MQ-RNN · S4</text>
  <rect x="230" y="208" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="226" class="t" font-size="12">World models</text>
  <text x="242" y="242" class="m">PETS · RSSM · ensembled RSSM</text>
  <text x="230" y="268" class="m">plus a Chronos zero-shot yardstick</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#pvar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">ASK</text>
  <text x="490" y="140" class="t" font-size="12">Imagine</text>
  <text x="490" y="156" class="m">a distribution over futures</text>
  <text x="490" y="176" class="t" font-size="12">What if</text>
  <text x="490" y="192" class="m">a different action sequence</text>
  <text x="490" y="212" class="t" font-size="12">Noise vs ignorance</text>
  <text x="490" y="228" class="m">aleatoric and epistemic,</text>
  <text x="490" y="242" class="m">separately actionable</text>
  <text x="490" y="258" class="m">in-browser ONNX lane</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">MEASURED</text>
  <text x="654" y="138" class="m">real flotation record,</text>
  <text x="654" y="152" class="m">hourly cadence:</text>
  <text x="654" y="174" class="bad" font-size="14">7 of 9 rungs</text>
  <text x="654" y="190" class="bad" font-size="12">do not beat the bar</text>
  <text x="654" y="212" class="m">no action set beats it</text>
  <text x="654" y="226" class="m">beyond the first step</text>
  <text x="654" y="250" class="warn" font-size="11">the case says so</text>

  <text x="32" y="316" class="m">Each case declares its expectation and what would refute it before it runs. The first bake's numbers were withdrawn (an action never consumed,</text>
  <text x="32" y="332" class="m">a biased CRPS estimator, unseeded rungs, a mismatched yardstick aggregation) and replaced by a re-bake; the defects are recorded in the findings.</text>
  <text x="32" y="356" class="m">The deploy drives a real browser against the live URL and refuses on an empty root or a console error. A CC-BY preprint on Zenodo carries the results.</text>
  <text x="32" y="380" class="warn" font-size="12">A research product, not a plant control system: no setpoint advice; logged actions come from a closed loop. Sibling of Fragua.</text>
</svg>
