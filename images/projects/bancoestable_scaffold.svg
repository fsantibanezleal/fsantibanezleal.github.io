<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="A product scaffold instantiated in July imported a model directory that the instantiation had dropped, so its pipeline and two test modules had never run; a tracked template sentinel silenced the residue guard; with no remote and no CI nothing surfaced for two months">
  <defs>
    <linearGradient id="bebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="bear" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <marker id="bebad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#f06292"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}.bad{stroke:#f06292}.badt{fill:#f06292}
      .mono{font-family:Consolas,'Cascadia Mono',monospace;font-size:11px}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#bebg)"/>
  <text x="32" y="40" class="t" font-size="20">A scaffold that never ran</text>
  <text x="32" y="60" class="m">Instantiated 2026-07-12, science added 2026-07-17, no remote, no CI; found on one disk on 2026-09-26</text>

  <rect x="32" y="88" width="150" height="120" rx="8" class="box"/>
  <text x="46" y="110" class="a" font-size="12">stages/</text>
  <text x="46" y="130" class="mono">train.py</text>
  <text x="46" y="146" class="mono">infer.py</text>
  <text x="46" y="162" class="mono">evaluate.py</text>
  <text x="46" y="184" class="mono">live.py</text>
  <text x="46" y="200" class="m">from ..model.sir import</text>

  <path d="M182 148 H236" class="bad" fill="none" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#bebad)"/>

  <rect x="236" y="88" width="150" height="120" rx="8" class="box bad" stroke-dasharray="6 4"/>
  <text x="250" y="110" class="badt" font-size="12">model/</text>
  <text x="250" y="134" class="badt" font-size="13">not there</text>
  <text x="250" y="156" class="m">dropped at instantiation;</text>
  <text x="250" y="170" class="m">the science modules were</text>
  <text x="250" y="184" class="m">added beside a pipeline</text>
  <text x="250" y="198" class="m">that could not import</text>

  <rect x="418" y="88" width="170" height="120" rx="8" class="box"/>
  <text x="432" y="110" class="a" font-size="12">tests/</text>
  <text x="432" y="130" class="mono">test_stability.py      ok</text>
  <text x="432" y="146" class="mono">test_hoekbrown_...py   ok</text>
  <text x="432" y="162" class="mono">test_contract.py       ok</text>
  <text x="432" y="182" class="mono badt">test_manifest.py   never</text>
  <text x="432" y="198" class="mono badt">pipeline_smoke.py  never</text>

  <rect x="618" y="88" width="150" height="120" rx="8" class="box"/>
  <text x="632" y="110" class="a" font-size="12">.template-source</text>
  <text x="632" y="132" class="m">still tracked, so the</text>
  <text x="632" y="146" class="m">residue guard printed</text>
  <text x="632" y="160" class="m">"this is the template"</text>
  <text x="632" y="174" class="m">and exited 0</text>
  <text x="632" y="196" class="warn" font-size="11">a gate that skips itself</text>

  <text x="32" y="246" class="t" font-size="13">What it took to find out: a venv and one command each</text>
  <text x="32" y="268" class="mono">python -m pytest -q          ModuleNotFoundError: No module named 'engine.model.sir'  (2 errors during collection)</text>
  <text x="32" y="286" class="mono">python data-pipeline/run.py  the same import, at line 1 of the orchestrator</text>

  <text x="32" y="322" class="m">Fixed the same day: the example model restored from the template, the sentinel removed so the guard reports the example cases</text>
  <text x="32" y="338" class="m">truthfully, no declared package (the offline code is invoked by path), VERSION 0.01.001, the ADR-0067 sweep, CI in the ADR-0074</text>
  <text x="32" y="354" class="m">shape, published private, registered as a PARKED scaffold. Its build still waits for research, a plan and a validation, as it should.</text>
  <text x="32" y="382" class="warn" font-size="12">Before recording any repository's state: create its venv, run its tests, its lint and its entry point, and write down what they printed.</text>
</svg>
