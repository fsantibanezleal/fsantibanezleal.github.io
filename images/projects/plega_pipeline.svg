<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Plega: one editable rigid-paper design moves as zero-thickness panels, is diagnosed for overlap, collision and separation, repaired with pinned comparisons and exported at actual size in PDF, SVG, FOLD and JSON, with the model's limits stated">
  <defs>
    <linearGradient id="plbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="plar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#plbg)"/>
  <text x="32" y="44" class="t" font-size="22">Plega</text>
  <text x="32" y="66" class="m">A rigid-paper mechanism workshop · the file that leaves is the file that gets cut, at the size it was designed</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">DESIGN</text>
  <text x="46" y="140" class="t" font-size="12">One editable source</text>
  <text x="46" y="158" class="m">12 cutwork compositions</text>
  <text x="46" y="172" class="m">6 original starters</text>
  <text x="46" y="186" class="m">2 mechanism families</text>
  <text x="46" y="200" class="m">up to 6 separated lanes</text>
  <text x="46" y="222" class="m">direct, transactional</text>
  <text x="46" y="236" class="m">editing on the canvas</text>
  <text x="46" y="256" class="warn" font-size="11">every coordinate in mm</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#plar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">MOVE AND DIAGNOSE</text>
  <rect x="230" y="116" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Rigid zero-thickness panels</text>
  <text x="242" y="150" class="m">the moving view of the design</text>
  <rect x="230" y="168" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="186" class="t" font-size="12">Explicit diagnoses</text>
  <text x="242" y="202" class="m">lane overlap · collision · separation</text>
  <rect x="230" y="220" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="238" class="t" font-size="12">Finite repairs, pinned</text>
  <text x="242" y="254" class="m">side by side; no optimality claim</text>
  <text x="230" y="274" class="m">2 invalid repair cases shipped on purpose</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#plar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">FABRICATE</text>
  <text x="490" y="140" class="t" font-size="12">Actual-size export</text>
  <text x="490" y="158" class="m">calibrated PDF and SVG</text>
  <text x="490" y="172" class="m">FOLD and JSON</text>
  <text x="490" y="194" class="t" font-size="12">Assembly progress</text>
  <text x="490" y="210" class="m">tracked per design</text>
  <text x="490" y="234" class="m">anonymous, EN and ES,</text>
  <text x="490" y="248" class="m">light and dark</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">NOT PREDICTED</text>
  <text x="654" y="138" class="m">material stiffness</text>
  <text x="654" y="154" class="m">fold forces</text>
  <text x="654" y="170" class="m">glue performance</text>
  <text x="654" y="186" class="m">printer calibration</text>
  <text x="654" y="202" class="m">assembly success</text>
  <text x="654" y="226" class="warn" font-size="11">a lane overlap is</text>
  <text x="654" y="240" class="warn" font-size="11">uncertified separation,</text>
  <text x="654" y="254" class="warn" font-size="11">not a certain collision</text>

  <text x="32" y="316" class="m">Each release recorded with its exact commit, release identifier and the Quality and Pages run that verified source and data, the production build,</text>
  <text x="32" y="332" class="m">a locked Chromium, artifact immutability and the custom-domain publication. 105 frontend and 24 Python tests; 14 CI and 14 live browser groups.</text>
  <text x="32" y="356" class="m">React 19, TypeScript, Vite, Three.js, pdf-lib; a Python standard-library data compiler. Apache-2.0 code, MIT design data, Noto Sans under OFL.</text>
  <text x="32" y="380" class="warn" font-size="12">Separate from its sibling Floraria, with its own history. GitHub Pages, no VPS. Lifecycle building; no adoption or owner acceptance claimed.</text>
</svg>
