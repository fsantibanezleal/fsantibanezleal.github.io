<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="OreFlow: an authored ore and plant case enters a closed-circuit size-by-mineral engine, crushing, closed grinding with cyclones, separation, that closes every unit within 1e-9; a TypeScript port re-solves it in the browser on every control change; method records and learned surrogates are baked offline; the measured lanes are kept apart">
  <defs>
    <linearGradient id="ofbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ofar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#ofbg)"/>
  <text x="32" y="44" class="t" font-size="22">OreFlow</text>
  <text x="32" y="66" class="m">A grinding and separation circuit read as one balance · a setting changed in one stage is followed through every stage after it</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">CASE</text>
  <text x="46" y="140" class="t" font-size="12">12 authored ores</text>
  <text x="46" y="158" class="m">6 variants each (72),</text>
  <text x="46" y="172" class="m">one declared input</text>
  <text x="46" y="186" class="m">changed per variant</text>
  <text x="46" y="208" class="m">rougher · gravity+rougher</text>
  <text x="46" y="222" class="m">magnetic · deslime</text>
  <text x="46" y="246" class="warn" font-size="11">authored, not calibrated</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#ofar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">ENGINE, ONE BALANCE</text>
  <rect x="230" y="116" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Every stream: 63 sizes</text>
  <text x="242" y="150" class="m">per mineral, plus water</text>
  <rect x="230" y="168" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="186" class="t" font-size="12">Closed grinding circuit</text>
  <text x="242" y="202" class="m">PBM ball mill · Plitt cyclones</text>
  <rect x="230" y="220" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="238" class="t" font-size="12">Separation</text>
  <text x="242" y="254" class="m">flotation · gravity · LIMS · deslime</text>
  <text x="230" y="274" class="m">every unit closes within 1e-9</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#ofar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">WORKBENCH</text>
  <text x="490" y="140" class="t" font-size="12">Re-solved live</text>
  <text x="490" y="158" class="m">TypeScript port in a</text>
  <text x="490" y="172" class="m">Web Worker, within 1e-6</text>
  <text x="490" y="186" class="m">of Python on 72 variants</text>
  <text x="490" y="208" class="m">flowsheet · curves ·</text>
  <text x="490" y="222" class="m">sweeps · methods · focus</text>
  <text x="490" y="246" class="m">t/h metal · MW · m3 · kg</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">BAKED</text>
  <text x="654" y="138" class="m">kinetic fits</text>
  <text x="654" y="154" class="m">constrained optimizer</text>
  <text x="654" y="170" class="m">uncertainty · Sobol</text>
  <text x="654" y="192" class="t" font-size="12">5 surrogates</text>
  <text x="654" y="210" class="m">leave one case out,</text>
  <text x="654" y="224" class="m">autoencoder guard</text>
  <text x="654" y="246" class="m">ONNX, re-run exact</text>

  <text x="32" y="316" class="m">Measured lanes kept apart from the engine and never used to calibrate it: HZDR particle dataset (RODARE 336), 52 GeoMet locked-cycle</text>
  <text x="32" y="332" class="m">tests (Zenodo 7051975). Checked against published examples, labelled as such: Moly-Cop BallSim, GMG Bond, Laplante gravity, Zandrivierspoort.</text>
  <text x="32" y="356" class="m">341 Python tests, 165 frontend tests, a 684-check browser gate over 3 viewports, 2 themes, 2 languages. 0.05.000, MIT, part of the Faena hub.</text>
  <text x="32" y="380" class="warn" font-size="12">A specific plant needs its own metallurgical tests; the site says so.</text>
</svg>
