<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Floraria: museum scans and authored component models, kept in labelled lanes, feed one continuous scene that opens from the whole plant to tissues, cells and compartments by scroll or pinch, with guided investigations and export; what a scan cannot establish is stated">
  <defs>
    <linearGradient id="flbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="flar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#flbg)"/>
  <text x="32" y="44" class="t" font-size="22">Floraria</text>
  <text x="32" y="66" class="m">One continuous botanical scene · from the bloom a visitor recognises to the compartment a textbook names</text>

  <rect x="32" y="92" width="176" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">TWO LANES, LABELLED</text>
  <text x="46" y="140" class="t" font-size="12">Real scans</text>
  <text x="46" y="156" class="m">5 Smithsonian CC0 blooms,</text>
  <text x="46" y="170" class="m">2 fidelities each</text>
  <text x="46" y="184" class="m">outer surfaces only</text>
  <text x="46" y="206" class="t" font-size="12">Authored models</text>
  <text x="46" y="222" class="m">general flower and orchid,</text>
  <text x="46" y="236" class="m">named structures, assembly</text>
  <text x="46" y="256" class="warn" font-size="11">never mixed, in every export</text>

  <path d="M208 180 H240" class="acc" fill="none" stroke-width="2" marker-end="url(#flar)"/>

  <rect x="240" y="80" width="204" height="200" rx="10" class="box"/>
  <text x="256" y="104" class="a" font-size="13">ONE SCENE</text>
  <rect x="256" y="116" width="172" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="268" y="134" class="t" font-size="12">Whole plant</text>
  <text x="268" y="150" class="m">point at a part, scroll in</text>
  <rect x="256" y="168" width="172" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="268" y="186" class="t" font-size="12">Organ, tissue, cell</text>
  <text x="268" y="202" class="m">enclosing structures open</text>
  <rect x="256" y="220" width="172" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="268" y="238" class="t" font-size="12">Compartment</text>
  <text x="268" y="254" class="m">3 constructions, 4 pathways</text>
  <text x="256" y="274" class="m">wheel or pinch; keyboard and touch</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#flar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">INVESTIGATE</text>
  <text x="490" y="140" class="t" font-size="12">12 guided</text>
  <text x="490" y="156" class="t" font-size="12">investigations</text>
  <text x="490" y="176" class="m">inspection, morphology,</text>
  <text x="490" y="190" class="m">comparisons, sourced</text>
  <text x="490" y="204" class="m">evidence</text>
  <text x="490" y="228" class="m">bookmarks, shareable</text>
  <text x="490" y="242" class="m">selections, JSON and</text>
  <text x="490" y="256" class="m">PNG export; EN and ES</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">NOT CLAIMED</text>
  <text x="654" y="138" class="m">internal organs or</text>
  <text x="654" y="152" class="m">segmentation from</text>
  <text x="654" y="166" class="m">a scan</text>
  <text x="654" y="186" class="m">a shared physical</text>
  <text x="654" y="200" class="m">scale</text>
  <text x="654" y="220" class="m">growth prediction,</text>
  <text x="654" y="234" class="m">identification,</text>
  <text x="654" y="248" class="m">adoption</text>

  <text x="32" y="316" class="m">Rebuilt twice on the owner's verdict, with every earlier release kept reachable: 0.02.000 studio, 0.03.000 checkpoint, 0.06.000 continuous scene,</text>
  <text x="32" y="332" class="m">each recorded with its exact commit, release identifier and the Quality and Pages runs that verified it (Node 22 and 24, exact-artifact Chromium).</text>
  <text x="32" y="356" class="m">160 frontend and 56 Python tests; a 31-scenario, 126-check browser suite; phone-pointer navigation at 390 by 844. Apache-2.0 code.</text>
  <text x="32" y="380" class="warn" font-size="12">A curated spatial knowledge atlas, not the six-page science shell; museum data keeps its recorded source rights. Lifecycle building.</text>
</svg>
