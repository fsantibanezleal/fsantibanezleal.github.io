<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Fragua: a process record is fitted by many realizations drawn from a bank of phenomenological model families, multistarts and bootstrap resamples, aggregated into a calibrated ensemble with structural inclusion probabilities, compared against controls, discovery, hybrid and learned rungs of a twelve-rung ladder; the engine is the separate phenoforge package">
  <defs>
    <linearGradient id="frbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="frar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#frbg)"/>
  <text x="32" y="44" class="t" font-size="22">Fragua</text>
  <text x="32" y="66" class="m">Which model describes this process, with what confidence · structure as an estimated quantity, not a choice made once</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">RECORD</text>
  <text x="46" y="140" class="t" font-size="12">14 cases, 7 processes</text>
  <text x="46" y="158" class="m">clean · dense · noisy ·</text>
  <text x="46" y="172" class="m">rough · sparse variants</text>
  <text x="46" y="192" class="m">a misspecified control:</text>
  <text x="46" y="206" class="m">truth outside every family</text>
  <text x="46" y="228" class="m">frozen sources: CC0 iron-</text>
  <text x="46" y="242" class="m">ore flotation, Tennessee</text>
  <text x="46" y="256" class="m">Eastman (SHA-256)</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#frar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">BAPE (phenoforge, PyPI)</text>
  <rect x="230" y="116" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">A bank of families</text>
  <text x="242" y="150" class="m">36 families catalogued</text>
  <rect x="230" y="168" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="186" class="t" font-size="12">Many realizations</text>
  <text x="242" y="202" class="m">families x multistarts x bootstraps</text>
  <rect x="230" y="220" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="238" class="t" font-size="12">Aggregate, calibrate</text>
  <text x="242" y="254" class="m">inclusion probability per family</text>
  <text x="230" y="274" class="m">rung 6 of 12; baked over 30 variants</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#frar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">ANSWER</text>
  <text x="490" y="140" class="t" font-size="12">The fingerprint first</text>
  <text x="490" y="156" class="m">which families the data</text>
  <text x="490" y="170" class="m">supports, and how much</text>
  <text x="490" y="192" class="t" font-size="12">Then the fan</text>
  <text x="490" y="208" class="m">what structural doubt</text>
  <text x="490" y="222" class="m">means for prediction</text>
  <text x="490" y="236" class="m">beyond the training</text>
  <text x="490" y="250" class="m">envelope</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">THE OTHER RUNGS</text>
  <text x="654" y="138" class="m">controls</text>
  <text x="654" y="154" class="m">BIC model average</text>
  <text x="654" y="168" class="m">(Goodman-Weare)</text>
  <text x="654" y="184" class="m">ensemble SINDy</text>
  <text x="654" y="200" class="m">Kennedy-O'Hagan GP</text>
  <text x="654" y="216" class="m">deep ensembles,</text>
  <text x="654" y="230" class="m">mixture of experts</text>
  <text x="654" y="254" class="warn" font-size="11">360-row benchmark</text>

  <text x="32" y="316" class="m">The research pass found the BAPE crossing absent from the literature and from vendor tooling; the plan was validated by the owner on 2026-08-25</text>
  <text x="32" y="332" class="m">before the build. The browser runs a real live lane: the published phenoforge wheel installed through Pyodide and micropip.</text>
  <text x="32" y="356" class="m">Every benchmark number is a committed artifact aggregated from traces after a completeness validator passes; the web reads only artifacts.</text>
  <text x="32" y="380" class="warn" font-size="12">Private repository; static site on the ML VPS; version 0.05.001; MIT. Lifecycle building, at-bar review is the owner's call.</text>
</svg>
