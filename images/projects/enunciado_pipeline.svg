<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Enunciado: twenty authored problem statements are handed to sixteen language models through the copela harness, each returned formal model is judged by executable, structural and property layers over a solver, and the faithfulness rates are recounted from the ledger">
  <defs>
    <linearGradient id="enbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="enar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#enbg)"/>
  <text x="32" y="44" class="t" font-size="22">Enunciado</text>
  <text x="32" y="66" class="m">The field scores whether the model ran · Enunciado scores whether it is the problem that was stated</text>

  <rect x="32" y="92" width="150" height="170" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">STATEMENTS</text>
  <text x="46" y="140" class="t" font-size="12">20 authored cases</text>
  <text x="46" y="158" class="m">4 per tier, 5 tiers</text>
  <text x="46" y="172" class="m">every trap covered</text>
  <text x="46" y="186" class="m">4 controls, no trap</text>
  <text x="46" y="206" class="m">references solved and</text>
  <text x="46" y="220" class="m">certified by the bake</text>
  <text x="46" y="240" class="warn" font-size="11">3 of 20 claimed optima</text>
  <text x="46" y="254" class="warn" font-size="11">were wrong</text>

  <path d="M182 177 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#enar)"/>

  <rect x="214" y="92" width="150" height="170" rx="10" class="box"/>
  <text x="228" y="116" class="a" font-size="13">MODELS</text>
  <text x="228" y="140" class="t" font-size="12">16 models, 4 providers</text>
  <text x="228" y="160" class="m">Anthropic, Z.AI, DeepSeek</text>
  <text x="228" y="176" class="m">11 open weights, Ollama</text>
  <text x="228" y="192" class="m">on one 8 GB laptop GPU</text>
  <text x="228" y="216" class="m">320 calls, every row</text>
  <text x="228" y="232" class="m">complete; budget guard</text>
  <text x="228" y="250" class="m">refuses a call without one</text>

  <path d="M364 177 H396" class="acc" fill="none" stroke-width="2" marker-end="url(#enar)"/>

  <rect x="396" y="80" width="220" height="200" rx="10" class="box"/>
  <text x="412" y="104" class="a" font-size="13">ORACLE, NOT A MODEL</text>
  <rect x="412" y="116" width="188" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="424" y="134" class="t" font-size="12">Executable</text>
  <text x="424" y="150" class="m">does it solve, to what optimum</text>
  <rect x="412" y="162" width="188" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="424" y="180" class="t" font-size="12">Structural</text>
  <text x="424" y="196" class="m">the elements the statement has</text>
  <rect x="412" y="208" width="188" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="424" y="226" class="t" font-size="12">Property + duality certificate</text>
  <text x="424" y="242" class="m">relations that must hold</text>
  <text x="412" y="268" class="m">one failure taxonomy, the classifier's own</text>

  <path d="M616 180 H648" class="acc" fill="none" stroke-width="2" marker-end="url(#enar)"/>

  <rect x="648" y="92" width="120" height="170" rx="10" class="box acc"/>
  <text x="662" y="116" class="a" font-size="12">FAITHFUL</text>
  <text x="662" y="140" class="m">best local model</text>
  <text x="662" y="156" class="t" font-size="12">phi4: 5 of 20</text>
  <text x="662" y="182" class="m">DeepSeek-V4-Pro</text>
  <text x="662" y="198" class="t" font-size="12">2 of 20 at 8192</text>
  <text x="662" y="214" class="t" font-size="12">11 of 20 at 32768</text>
  <text x="662" y="238" class="m">the cap decides the</text>
  <text x="662" y="254" class="m">reasoning models</text>

  <text x="32" y="318" class="m">Three repositories: planteo (the representation) and copela (the harness), both on PyPI from their own repos; Enunciado declares no package.</text>
  <text x="32" y="338" class="m">10 defects caught by gates rather than review, and 4 times a gate caught itself. The first version of the measurement read +0.000 and was wrong.</text>
  <text x="32" y="358" class="m">Every rate on the site is recounted from the committed 640-record ledger in CI. 197 browser checks pass against the live origin.</text>
</svg>
