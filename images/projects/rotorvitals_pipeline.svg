<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="RotorVitals: source selector feeding classical DSP, a learned WDCNN/AE tier, and a four-model RUL ladder, live in the browser">
  <defs>
    <linearGradient id="rvbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{stroke:#29B6F6}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#rvbg)"/>
  <text x="32" y="46" class="t" font-size="22">RotorVitals</text>
  <text x="32" y="68" class="m">Rotating-machinery condition monitoring &amp; prognostics · bearings-first · in-browser · real data</text>

  <rect x="32" y="96" width="180" height="252" rx="10" class="box acc"/>
  <text x="48" y="122" class="a" font-size="13">SOURCE SELECTOR</text>
  <rect x="48" y="138" width="148" height="52" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="160" class="t" font-size="12">Synthetic</text><text x="60" y="178" class="m">generator + knobs</text>
  <rect x="48" y="200" width="148" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="222" class="t" font-size="12">Real: diagnosis</text><text x="60" y="240" class="m">CWRU · Ottawa(order) · MaFaulDa</text>
  <rect x="48" y="270" width="148" height="60" rx="7" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="292" class="t" font-size="12">Real: run-to-failure</text><text x="60" y="310" class="m">FEMTO · XJTU · IMS (36 traj.)</text>

  <path d="M212 222 H250" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="256" y="104" width="270" height="74" rx="9" class="box"/>
  <text x="272" y="128" class="t" font-size="13">Classical DSP</text>
  <text x="272" y="150" class="m">envelope/SES · kurtogram · cyclostationary</text>
  <text x="272" y="168" class="m">cepstrum · Campbell/order · ISO 20816</text>

  <rect x="256" y="186" width="270" height="70" rx="9" class="box"/>
  <text x="272" y="210" class="t" font-size="13">Learned tier <tspan class="a">(ONNX)</tspan></text>
  <text x="272" y="232" class="m">WDCNN classifier · deep-autoencoder HI</text>
  <text x="272" y="250" class="m">in-domain CWRU · cross-domain labelled</text>

  <rect x="256" y="264" width="270" height="84" rx="9" class="box acc"/>
  <text x="272" y="288" class="a" font-size="13">RUL ladder</text>
  <text x="272" y="308" class="m">exponential · particle filter · Gaussian process</text>
  <text x="272" y="326" class="m">deep-RUL CNN · Deep-HI (CNN-BiLSTM)</text>
  <text x="272" y="344" class="m">α-λ + calibration vs true failure time</text>

  <path d="M526 141 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 221 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M526 306 H560" class="acc" fill="none" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="564" y="104" width="204" height="244" rx="10" class="box acc"/>
  <text x="580" y="128" class="a" font-size="13">LIVE IN BROWSER</text>
  <text x="580" y="150" class="m">onnxruntime-web (WASM)</text>
  <text x="580" y="168" class="m">TypeScript DSP · KaTeX</text>
  <polyline points="580,250 596,250 604,214 612,250 632,250 640,196 648,250 676,250 684,232 692,250 748,250"
            fill="none" stroke="#29B6F6" stroke-width="2"/>
  <line x1="580" y1="250" x2="752" y2="250" stroke="#30363d"/>
  <text x="580" y="286" class="m">envelope spectrum · BPFO/BPFI/BSF lines</text>
  <text x="580" y="316" class="t" font-size="12">Diagnosis + RUL + ISO zone</text>
  <text x="580" y="334" class="m">every number traces to a computed line</text>

  <text x="32" y="384" class="m">Honest: synthetic labelled · cross-domain flagged · frequencies exact · static GitHub Pages · v0.45</text>
</svg>
