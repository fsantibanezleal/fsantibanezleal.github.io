<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Sondara: collar, survey, assay and geology sources are desurveyed and reconstructed in WebGL in the browser, a support-weighted estimate with uncertainty and cross-validation is recomputed locally through the geocond engine, and the workbench states what it is not: a production resource estimate">
  <defs>
    <linearGradient id="sdbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="sdar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#sdbg)"/>
  <text x="32" y="44" class="t" font-size="22">Sondara</text>
  <text x="32" y="66" class="m">Local-first drillhole intelligence · the data stays on the machine, the estimate shows its doubt</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">SOURCES</text>
  <text x="46" y="140" class="t" font-size="12">Four tables</text>
  <text x="46" y="158" class="m">collar · survey ·</text>
  <text x="46" y="172" class="m">assay · geology</text>
  <text x="46" y="194" class="m">CSV depth and value</text>
  <text x="46" y="208" class="m">columns parsed in the</text>
  <text x="46" y="222" class="m">browser</text>
  <text x="46" y="246" class="warn" font-size="11">no login, no upload</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#sdar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">RECONSTRUCT (WebGL)</text>
  <rect x="230" y="116" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Desurveyed borehole tubes</text>
  <text x="242" y="150" class="m">assay supports along them</text>
  <rect x="230" y="168" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="186" class="t" font-size="12">Ore continuity shell</text>
  <text x="242" y="202" class="m">geology contacts, depth slicing</text>
  <rect x="230" y="220" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="238" class="t" font-size="12">Orbit, section, plan</text>
  <text x="242" y="254" class="m">selection follows the 3D scene</text>
  <text x="230" y="274" class="m">seed cases are explicit planning fixtures</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#sdar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">ESTIMATE, LOCAL</text>
  <text x="490" y="140" class="t" font-size="12">Support-weighted value</text>
  <text x="490" y="158" class="m">uncertainty and</text>
  <text x="490" y="172" class="m">cross-validation beside it</text>
  <text x="490" y="186" class="m">grade profile per method</text>
  <text x="490" y="210" class="t" font-size="12">Engine: geocond</text>
  <text x="490" y="226" class="m">support-aware</text>
  <text x="490" y="240" class="m">conditioning, covariance,</text>
  <text x="490" y="254" class="m">sequential simulation</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">NOT THIS</text>
  <text x="654" y="138" class="m">a production</text>
  <text x="654" y="152" class="m">resource estimate</text>
  <text x="654" y="172" class="m">QA/QC, compositing,</text>
  <text x="654" y="186" class="m">variogram fitting,</text>
  <text x="654" y="200" class="m">full covariance,</text>
  <text x="654" y="214" class="m">categorical simulation,</text>
  <text x="654" y="228" class="m">competent review</text>
  <text x="654" y="250" class="warn" font-size="11">planned, not done</text>

  <text x="32" y="316" class="m">A public alpha with its plan as the implementation authority: the local vertical (assay parsing and the support-weighted estimator) is live; the</text>
  <text x="32" y="332" class="m">full covariance solvers, categorical simulation and the learned method matrix are recorded as planned; the bounded server lane is not promoted.</text>
  <text x="32" y="356" class="m">GitHub Pages plus a static mirror on the ML VPS over HTTPS; a strict job contract and reproducible pipeline scripts in the repository.</text>
  <text x="32" y="380" class="warn" font-size="12">Version 0.02.001; geocond 0.1.1 published 2026-09-26; lifecycle building. Sibling of Aerovia by rebuild discipline.</text>
</svg>
