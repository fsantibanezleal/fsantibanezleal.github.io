<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Inverse Earth Studio: twenty synthetic geological constructors under six conditions are inverted by several physics, gravity, layered magnetotellurics, acoustic full-waveform inversion, learned inverses and joint cross-gradient inversion, baked locally on a GPU and replayed in the browser with an inversion scrubber and a 3D scene; the numerics are checked against independent codes and the boundaries are stated">
  <defs>
    <linearGradient id="gpbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="gpar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#gpbg)"/>
  <text x="32" y="44" class="t" font-size="22">Inverse Earth Studio</text>
  <text x="32" y="66" class="m">Several physics on the same synthetic earths · what a surface survey recovers is compared, not asserted</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">EARTHS</text>
  <text x="46" y="140" class="t" font-size="12">20 constructors</text>
  <text x="46" y="158" class="m">stocks, basins, faults,</text>
  <text x="46" y="172" class="m">dykes and more</text>
  <text x="46" y="194" class="t" font-size="12">6 conditions each</text>
  <text x="46" y="212" class="m">120 artifacts</text>
  <text x="46" y="226" class="m">324 method results</text>
  <text x="46" y="248" class="warn" font-size="11">original, synthetic</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#gpar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">PHYSICS, BAKED ON A GPU</text>
  <rect x="230" y="116" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Gravity (3D potential fields)</text>
  <text x="242" y="150" class="m">SimPEG kernels; sparse IRLS</text>
  <rect x="230" y="162" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="180" class="t" font-size="12">Layered MT · acoustic FWI</text>
  <text x="242" y="196" class="m">live MT solve; Deepwave adjoint</text>
  <rect x="230" y="208" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="226" class="t" font-size="12">Learned inverses · joint inversion</text>
  <text x="242" y="242" class="m">CNN, autoencoder; cross-gradient</text>
  <text x="230" y="268" class="m">RTX 4070 is the accelerator; never in CI</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#gpar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">REPLAY</text>
  <text x="490" y="140" class="t" font-size="12">One case at a time</text>
  <text x="490" y="158" class="m">case · experiment ·</text>
  <text x="490" y="172" class="m">inverse method</text>
  <text x="490" y="194" class="t" font-size="12">Inversion scrubber</text>
  <text x="490" y="212" class="m">computed states, 8/8</text>
  <text x="490" y="230" class="t" font-size="12">3D scene</text>
  <text x="490" y="248" class="m">cut · threshold · rotation</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">CHECKED</text>
  <text x="654" y="138" class="m">Choclo and SimPEG</text>
  <text x="654" y="152" class="m">prism checks</text>
  <text x="654" y="172" class="m">Deepwave CUDA</text>
  <text x="654" y="186" class="m">adjoint executed</text>
  <text x="654" y="206" class="m">complex MT parity</text>
  <text x="654" y="226" class="m">15 numerical and</text>
  <text x="654" y="240" class="m">15 frontend tests</text>

  <text x="32" y="316" class="m">Learned split: 800, 160 and 160 independent realizations; the inverse CNN estimates column density, not a 3D volume. Both public hosts</text>
  <text x="32" y="332" class="m">match the local build byte for byte: 120 experiment hashes, six route documents, three model files. Apache-2.0 code, CC-BY-4.0 content.</text>
  <text x="32" y="356" class="m">Not claimed: field validation, posterior uncertainty, algorithmic novelty; Devito, MTpy/MTH5 and PGI surveyed, not implemented (issue #10).</text>
  <text x="32" y="380" class="warn" font-size="12">Version 2 replaced a first version its owner rejected; 0.03.000 gave the visual layer back to the shared shell.</text>
</svg>
