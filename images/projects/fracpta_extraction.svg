<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img"
     aria-label="The Pulso engine leaves the product as the fracpta package on PyPI; re-baking the consumer's cases exposed that two processes under the same seed produced different fracture networks because GeoDFN draws its spatial seeds from Python's random, which the adapter had never pinned; after the fix two processes reproduce a case byte for byte">
  <defs>
    <linearGradient id="fxbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="fxar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}.bad{fill:#f06292}.good{fill:#7ee787}
      .mono{font-family:Consolas,'Cascadia Mono',monospace;font-size:11px}
    </style>
  </defs>
  <rect width="800" height="420" fill="url(#fxbg)"/>
  <text x="32" y="40" class="t" font-size="20">The engine leaves the product</text>
  <text x="32" y="60" class="m">Pulso's in-repo package becomes fracpta on PyPI, and the re-bake finds a lane that had never been reproducible</text>

  <rect x="32" y="84" width="220" height="130" rx="8" class="box"/>
  <text x="46" y="106" class="a" font-size="12">BEFORE (Pulso 0.25)</text>
  <text x="46" y="128" class="t" font-size="12">data-pipeline/flowdnalab/</text>
  <text x="46" y="146" class="m">40 modules, 5,058 lines, `lab` in the name,</text>
  <text x="46" y="160" class="m">pip install -e ., python -m flowdnalab</text>
  <text x="46" y="178" class="warn" font-size="11">__version__ read 0.07.000</text>
  <text x="46" y="192" class="warn" font-size="11">while the product was at 0.25.001:</text>
  <text x="46" y="206" class="warn" font-size="11">eighteen releases behind</text>

  <path d="M252 149 H284" class="acc" fill="none" stroke-width="2" marker-end="url(#fxar)"/>

  <rect x="284" y="84" width="236" height="130" rx="8" class="box acc"/>
  <text x="298" y="106" class="a" font-size="12">AFTER (2026-09-26)</text>
  <text x="298" y="128" class="t" font-size="12">fracpta 0.1.1 on PyPI, own repository</text>
  <text x="298" y="146" class="m">analytic ensembles, GeoDFN networks and</text>
  <text x="298" y="160" class="m">descriptors, DARTS wrappers, contracts,</text>
  <text x="298" y="174" class="m">the clustering ladder, attribution, stages</text>
  <text x="298" y="194" class="t" font-size="12">Pulso 0.26: cases, manifest, export, gate</text>
  <text x="298" y="208" class="m">invoked by path; fracpta==0.1.1 pinned</text>

  <rect x="552" y="84" width="216" height="130" rx="8" class="box"/>
  <text x="566" y="106" class="a" font-size="12">THE RULE</text>
  <text x="566" y="128" class="t" font-size="12">A product declares no package</text>
  <text x="566" y="146" class="m">of its own. A required package is</text>
  <text x="566" y="160" class="m">its own repository, published,</text>
  <text x="566" y="174" class="m">consumed as a pinned dependency.</text>
  <text x="566" y="194" class="m">Presenting the violation as a choice</text>
  <text x="566" y="208" class="m">was itself the error.</text>

  <text x="32" y="250" class="t" font-size="13">Same seed, two processes, before the fix</text>
  <rect x="32" y="262" width="360" height="60" rx="8" class="box"/>
  <text x="46" y="284" class="mono bad">process A  seed 42  DFN06  2,854 leaves differ from B</text>
  <text x="46" y="302" class="mono">GeoDFN seeds positions from Python's random;</text>
  <text x="46" y="316" class="mono">the adapter pinned numpy only. Not PYTHONHASHSEED.</text>

  <rect x="408" y="262" width="360" height="60" rx="8" class="box acc"/>
  <text x="422" y="284" class="mono good">random.seed(seed) beside np.random.seed(seed):</text>
  <text x="422" y="302" class="mono good">0 leaves differ; the trace no longer records the</text>
  <text x="422" y="316" class="mono">absolute path of a temporary directory.</text>

  <text x="32" y="352" class="m">Nine cases re-baked under fracpta: the study numbers identical (the DARTS anchor byte for byte); the DFN cases changed because</text>
  <text x="32" y="368" class="m">they had never been reproducible, and now reproduce across processes. The cases not re-baked keep their older provenance, and say so.</text>
  <text x="32" y="392" class="m">One more, found after the deploy: the live-lane sources file had been written into an ignored build directory, so it was never</text>
  <text x="32" y="408" class="m">committed and the site answered 404. Moved with the other derived artifacts (0.26.001). A green deploy is not a served file.</text>
</svg>
