<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Destello: the whole MaleCNS nervous system driven through both real compound eyes by the flycns engine's four coupled models, read out for motion, depth, time to contact and figure-ground against three null wirings, and shown as real neurons firing in 3D; the engine is complete in Python and the web product is not yet built">
  <defs>
    <linearGradient id="dsbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="dsar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#dsbg)"/>
  <text x="32" y="44" class="t" font-size="22">Destello</text>
  <text x="32" y="66" class="m">The whole fly nervous system working through its two real eyes · engine measured first, product after</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">TWO REAL EYES</text>
  <text x="46" y="140" class="t" font-size="12">879 left, 892 right</text>
  <text x="46" y="156" class="m">measured columns</text>
  <text x="46" y="178" class="t" font-size="12">MaleCNS v1.0</text>
  <text x="46" y="194" class="m">166,700 neurons,</text>
  <text x="46" y="208" class="m">brain and nerve cord,</text>
  <text x="46" y="222" class="m">CC BY 4.0</text>
  <text x="46" y="246" class="warn" font-size="11">wiring frozen</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#dsar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">ENGINE: flycns, FOUR MODELS</text>
  <rect x="230" y="116" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">E1 published LIF everywhere</text>
  <text x="242" y="150" class="m">only the photoreceptors fire</text>
  <rect x="230" y="162" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="180" class="t" font-size="12">E2 graded optic lobes, bridged</text>
  <text x="242" y="196" class="m">95,925 neurons, 9.07 M connections</text>
  <rect x="230" y="208" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="226" class="t" font-size="12">E3 flyvis per eye · E4 stabilised</text>
  <text x="242" y="242" class="m">a flash reaches the nerve cord</text>
  <text x="230" y="268" class="m">0.06.000 complete in Python, on MaleCNS</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#dsar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">READ OUT (planned)</text>
  <text x="490" y="140" class="t" font-size="12">From the real neurons</text>
  <text x="490" y="156" class="m">motion · depth from</text>
  <text x="490" y="170" class="m">parallax · time to</text>
  <text x="490" y="184" class="m">contact · figure-ground</text>
  <text x="490" y="206" class="m">against three null wirings</text>
  <text x="490" y="228" class="m">13 cases, 6 or more</text>
  <text x="490" y="242" class="m">variants each, exact truth</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">SHOW (planned)</text>
  <text x="654" y="138" class="m">real somas and</text>
  <text x="654" y="152" class="m">arbors lighting up</text>
  <text x="654" y="172" class="m">slow motion, the</text>
  <text x="654" y="186" class="m">biological clock</text>
  <text x="654" y="206" class="m">stimulate, silence,</text>
  <text x="654" y="220" class="m">change the engine</text>
  <text x="654" y="244" class="m">WebGPU or WebGL2</text>

  <text x="32" y="316" class="m">Ordered on 2026-09-23 after Conectoma showed a type-level abstraction of one eye. Four verified dossiers first, a plan, the engine in its own</text>
  <text x="32" y="332" class="m">package (PyPI and npm names reserved; publishing waits on a pending publisher and an npm token), the product after. The eye model's vertical</text>
  <text x="32" y="356" class="m">was found one 60-degree lattice step off and fixed. Not a digital organism: the raw wiring does not form a heading bump or track small objects.</text>
  <text x="32" y="380" class="warn" font-size="12">Nothing deployed; version 0.00.000; lifecycle planned. Next: the scene renderer, the cases, the export, the web product with the 3D brain.</text>
</svg>
