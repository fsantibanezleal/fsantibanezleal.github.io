<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Laminario: a slide case with its macro and micro assets enters through an ingestion contract into the catalog and a durable job queue; the imaging engine writes pyramidal planes served over IIIF to a deep-zoom stage; contributors upload resumably and the community identifies; version 0.01.000 covers the data model only and nothing is deployed">
  <defs>
    <linearGradient id="lmbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="lmar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#lmbg)"/>
  <text x="32" y="44" class="t" font-size="22">Laminario</text>
  <text x="32" y="66" class="m">An open collection of microscope slides, each shown as the glass object it is · engine and contracts first, interface after</text>

  <rect x="32" y="92" width="160" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">A SLIDE CASE</text>
  <text x="46" y="140" class="t" font-size="12">format, macro image,</text>
  <text x="46" y="156" class="t" font-size="12">label with a QR</text>
  <text x="46" y="178" class="m">micro: images, pyramids,</text>
  <text x="46" y="192" class="m">focal planes, PPL and XPL</text>
  <text x="46" y="212" class="m">source, author, licence</text>
  <text x="46" y="226" class="m">per asset</text>
  <text x="46" y="248" class="warn" font-size="11">ingestion contract, U1</text>

  <path d="M192 180 H224" class="acc" fill="none" stroke-width="2" marker-end="url(#lmar)"/>

  <rect x="224" y="80" width="232" height="200" rx="10" class="box"/>
  <text x="240" y="104" class="a" font-size="13">API, QUEUE, IMAGING</text>
  <rect x="240" y="116" width="200" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="134" class="t" font-size="12">FastAPI over SQLite (FTS5)</text>
  <text x="252" y="150" class="m">invitation-only accounts</text>
  <rect x="240" y="162" width="200" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="180" class="t" font-size="12">worker on durable jobs</text>
  <text x="252" y="196" class="m">tus uploads, quarantine, quotas</text>
  <rect x="240" y="208" width="200" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="226" class="t" font-size="12">libvips + OpenSlide</text>
  <text x="252" y="242" class="m">one pyramidal BigTIFF per plane</text>
  <text x="240" y="268" class="m">U2 to U6, not yet built</text>

  <path d="M456 180 H488" class="acc" fill="none" stroke-width="2" marker-end="url(#lmar)"/>

  <rect x="488" y="92" width="140" height="176" rx="10" class="box"/>
  <text x="502" y="116" class="a" font-size="13">IIIF DELIVERY</text>
  <text x="502" y="140" class="t" font-size="12">Image API 3, level 2</text>
  <text x="502" y="156" class="m">iipsrv behind nginx</text>
  <text x="502" y="176" class="t" font-size="12">Presentation 3</text>
  <text x="502" y="192" class="m">one manifest per slide</text>
  <text x="502" y="212" class="m">any IIIF viewer</text>
  <text x="502" y="226" class="m">can open it</text>
  <text x="502" y="248" class="m">U3, planned</text>

  <rect x="644" y="92" width="124" height="176" rx="10" class="box acc"/>
  <text x="658" y="116" class="a" font-size="12">THE STAGE</text>
  <text x="658" y="138" class="m">OpenSeadragon</text>
  <text x="658" y="152" class="m">deep zoom, scale bar</text>
  <text x="658" y="172" class="m">3 realms, 18 sets,</text>
  <text x="658" y="186" class="m">129 sub-collections</text>
  <text x="658" y="206" class="m">community identifies</text>
  <text x="658" y="220" class="m">two-thirds rule</text>
  <text x="658" y="244" class="m">U9 to U11, planned</text>

  <text x="32" y="316" class="m">Built in the mandatory order: seven dossiers, ADR-0077, a design document with a named gate per requirement, the plan validated</text>
  <text x="32" y="332" class="m">on 2026-09-24, then the units. A base collection of at least 300 openly licensed slides (NHM, Smithsonian, Zenodo, Commons,</text>
  <text x="32" y="356" class="m">CDC PHIL) enters through the same pipeline as a contributor's upload. Own design system, by Felipe's instruction.</text>
  <text x="32" y="380" class="warn" font-size="12">Version 0.01.000 (2026-09-25): the data model and both contracts. Nothing deployed; lifecycle planned; a 100 GB volume waits.</text>
</svg>
