<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Conectoma: the MaleCNS wiring is compiled and frozen, three regimes differ only in what is learned, video cases from open datasets are scored, and every result is an effect size against three null controls built from the same wiring">
  <defs>
    <linearGradient id="cnbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="cnar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}.good{fill:#7ee787}.bad{fill:#f06292}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#cnbg)"/>
  <text x="32" y="44" class="t" font-size="22">Conectoma</text>
  <text x="32" y="66" class="m">A fly connectome as a frozen vision network · every claim an effect size against nulls built from the same wiring</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">WIRING, FROZEN</text>
  <text x="46" y="140" class="t" font-size="12">MaleCNS v1.0</text>
  <text x="46" y="158" class="m">166,691 neurons,</text>
  <text x="46" y="172" class="m">11,691 cell types, CC-BY</text>
  <text x="46" y="192" class="m">synapse counts and</text>
  <text x="46" y="206" class="m">signs are measurements;</text>
  <text x="46" y="220" class="m">they never move</text>
  <text x="46" y="246" class="warn" font-size="11">parity voltage for voltage</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#cnar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">THREE REGIMES, ONE START</text>
  <rect x="230" y="116" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Readout head only</text>
  <text x="242" y="150" class="m">the connectome as a reservoir</text>
  <rect x="230" y="162" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="180" class="t" font-size="12">Per-type biophysics</text>
  <text x="242" y="196" class="m">the published 734-parameter form</text>
  <rect x="230" y="208" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="226" class="t" font-size="12">Per-edge gain</text>
  <text x="242" y="242" class="m">the most the optimizer may touch</text>
  <text x="230" y="268" class="m">22 methods, 16 video cases, 6 variants each</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#cnar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">TASKS</text>
  <text x="490" y="140" class="t" font-size="12">Depth from motion</text>
  <text x="490" y="156" class="m">a moving camera; flies</text>
  <text x="490" y="170" class="m">judge distance by parallax</text>
  <text x="490" y="192" class="t" font-size="12">Figure-ground</text>
  <text x="490" y="208" class="m">segmentation</text>
  <text x="490" y="230" class="m">TartanAir (CC BY 4.0);</text>
  <text x="490" y="244" class="m">Spring, Hypersim, Sintel,</text>
  <text x="490" y="258" class="m">fly-eye renders as controls</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">VS THREE NULLS</text>
  <text x="654" y="138" class="m">random sparse graph,</text>
  <text x="654" y="152" class="m">size-matched</text>
  <text x="654" y="166" class="good" font-size="12">+0.197</text>
  <text x="654" y="186" class="m">sign shuffle</text>
  <text x="654" y="200" class="good" font-size="12">+0.136</text>
  <text x="654" y="220" class="m">degree-preserving</text>
  <text x="654" y="234" class="m">rewiring</text>
  <text x="654" y="248" class="bad" font-size="12">-0.017</text>

  <text x="32" y="316" class="m">Paired per clip, five seeds each. What the biology adds over a random graph of the same size and signs, it does not add over a</text>
  <text x="32" y="332" class="m">rewiring that keeps every cell's degree. Six defects found by building: a placement rule dropped 3,270 connections; a column frame a half-turn off.</text>
  <text x="32" y="356" class="m">Live at 0.10.001 with the pathway animated; 1,183 checks against the HTTPS URL. Engine flyvis (published); no companion package needed.</text>
  <text x="32" y="380" class="warn" font-size="12">Plan not validated, lifecycle planned. Its owner's verdict led to a successor, Destello, that drives the whole real nervous system.</text>
</svg>
