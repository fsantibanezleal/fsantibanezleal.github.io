<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Neuraxis and reflexmesh: typed events enter a fast controller whose registered actions have verified effects, a learned allocation gate decides when slower reasoning is recruited, the outcome feeds the gate back; the evaluation over 19,488 episodes does not establish learned superiority and the card says so">
  <defs>
    <linearGradient id="nxbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="nxar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#nxbg)"/>
  <text x="32" y="44" class="t" font-size="22">Neuraxis and reflexmesh</text>
  <text x="32" y="66" class="m">A fast, accountable controller for software and files · slow reasoning recruited only where the outcome justifies it</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">WORK</text>
  <text x="46" y="140" class="t" font-size="12">Supplied files</text>
  <text x="46" y="158" class="m">verify a release ·</text>
  <text x="46" y="172" class="m">reconcile CSV records ·</text>
  <text x="46" y="186" class="m">audit sources</text>
  <text x="46" y="208" class="m">typed events in,</text>
  <text x="46" y="222" class="m">originals untouched</text>
  <text x="46" y="246" class="warn" font-size="11">real findings, not a sim</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#nxar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">reflexmesh (PyPI, Rust/PyO3)</text>
  <rect x="230" y="116" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">Fast path</text>
  <text x="242" y="150" class="m">registered actions, verified effects</text>
  <rect x="230" y="168" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="186" class="t" font-size="12">Allocation gate</text>
  <text x="242" y="202" class="m">learned from outcomes: defer or not</text>
  <rect x="230" y="220" width="198" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="238" class="t" font-size="12">Slow path</text>
  <text x="242" y="254" class="m">language-model reasoning, recruited</text>
  <text x="230" y="274" class="m">recurrent, resource-versioned, async</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#nxar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">OUTPUT</text>
  <text x="490" y="140" class="t" font-size="12">9 verified steps</text>
  <text x="490" y="158" class="m">execution map with an</text>
  <text x="490" y="172" class="m">action inspector</text>
  <text x="490" y="194" class="t" font-size="12">Checked exports</text>
  <text x="490" y="212" class="m">findings, manifest,</text>
  <text x="490" y="226" class="m">accepted rows</text>
  <text x="490" y="248" class="m">matched runs compared</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">MEASURED</text>
  <text x="654" y="138" class="m">19,488 episodes</text>
  <text x="654" y="154" class="m">14,400 core, 288 xfer,</text>
  <text x="654" y="168" class="m">4,800 ablations</text>
  <text x="654" y="190" class="t" font-size="12">M12: 1,160 / 1,200</text>
  <text x="654" y="206" class="m">exact baseline 1,200</text>
  <text x="654" y="228" class="warn" font-size="11">fitted gates: no defer;</text>
  <text x="654" y="242" class="warn" font-size="11">4 fixed gates = M12</text>

  <text x="32" y="316" class="m">Two repositories with a package boundary: reflexmesh is public on PyPI (0.1.0, nine wheels plus sdist) from its own repository; Neuraxis is</text>
  <text x="32" y="332" class="m">the private app with no installable package of its own. Research dossiers first, with source ledgers that separate a source read from an experiment run.</text>
  <text x="32" y="356" class="m">0.02 rebuilt on 2026-09-24 after the simulation-first version was rejected. Private hosted CI blocked by account billing, and the record says so.</text>
  <text x="32" y="380" class="warn" font-size="12">Not claimed: learned superiority, AGI, biological equivalence. Fast-and-slow routing alone is prior art.</text>
</svg>
