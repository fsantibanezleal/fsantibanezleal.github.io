<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Aerovia: a ventilation network is drawn in 3D, solved for flow, pressure, paths, fan duty and energy, a passive tracer is transported through it with a mass ledger, and learned models screen designs with their approximation limit stated, all in the browser">
  <defs>
    <linearGradient id="avbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="avar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#avbg)"/>
  <text x="32" y="44" class="t" font-size="22">Aerovia</text>
  <text x="32" y="66" class="m">Underground ventilation, the whole loop in the browser · draw, solve, trace, screen</text>

  <rect x="32" y="92" width="160" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">DESIGN</text>
  <text x="46" y="140" class="t" font-size="12">Draw the network in 3D</text>
  <text x="46" y="160" class="m">draw · connect · move · split</text>
  <text x="46" y="176" class="m">boundaries and fans</text>
  <text x="46" y="192" class="m">node and airway CSV import</text>
  <text x="46" y="208" class="m">undo, recovery, portable</text>
  <text x="46" y="224" class="m">projects</text>
  <text x="46" y="250" class="m">12 authored network cases</text>

  <path d="M192 180 H224" class="acc" fill="none" stroke-width="2" marker-end="url(#avar)"/>

  <rect x="224" y="80" width="200" height="200" rx="10" class="box"/>
  <text x="240" y="104" class="a" font-size="13">SOLVE</text>
  <rect x="240" y="116" width="168" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="134" class="t" font-size="12">Flow and pressure</text>
  <text x="252" y="150" class="m">paths, recirculation</text>
  <rect x="240" y="168" width="168" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="186" class="t" font-size="12">Fans and energy</text>
  <text x="252" y="202" class="m">duty, sensitivity, baselines</text>
  <rect x="240" y="220" width="168" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="238" class="t" font-size="12">Numerical workers</text>
  <text x="252" y="254" class="m">local, no server</text>

  <path d="M424 180 H456" class="acc" fill="none" stroke-width="2" marker-end="url(#avar)"/>

  <rect x="456" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="470" y="116" class="a" font-size="13">TRACE</text>
  <text x="470" y="140" class="t" font-size="12">Passive tracer</text>
  <text x="470" y="158" class="m">conservative transport</text>
  <text x="470" y="174" class="m">pulse or continuous</text>
  <text x="470" y="190" class="m">scheduled changes</text>
  <text x="470" y="206" class="m">timeline playback</text>
  <text x="470" y="230" class="t" font-size="12">Complete mass ledger</text>
  <text x="470" y="250" class="m">animated field (0.02.001)</text>

  <path d="M606 180 H638" class="acc" fill="none" stroke-width="2" marker-end="url(#avar)"/>

  <rect x="638" y="92" width="130" height="176" rx="10" class="box acc"/>
  <text x="652" y="116" class="a" font-size="12">SCREEN</text>
  <text x="652" y="138" class="m">MLP + graph models</text>
  <text x="652" y="154" class="t" font-size="12">24 ONNX exports</text>
  <text x="652" y="176" class="m">33,792 dataset states</text>
  <text x="652" y="192" class="m">216-cell benchmark</text>
  <text x="652" y="216" class="warn" font-size="11">each with its held-out</text>
  <text x="652" y="230" class="warn" font-size="11">approximation limit</text>
  <text x="652" y="254" class="m">inference in-browser</text>

  <text x="32" y="318" class="m">Networks are planning inputs, not measured mines. User acceptance, industrial savings, field calibration and adoption are not claimed.</text>
  <text x="32" y="338" class="m">A first version was rejected and rebuilt from the product template on the shared shell; the rebuild receipt ties every claim to a commit.</text>
  <text x="32" y="358" class="m">34 Chromium journeys without retries, 5 direct-route refreshes, 24 inference checks, 119 runtime files verified. GitHub Pages, Apache-2.0.</text>
</svg>
