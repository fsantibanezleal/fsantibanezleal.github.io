<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="Fragmenta: sixteen blast cases from published corpora run through twelve arms, six classical and six learned, scored under three split protocols; under leave-one-site-out the learned arms explain no variance and only the two fixed-coefficient arms stay positive; the engine is the separate blastfrag package">
  <defs>
    <linearGradient id="fgbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="fgar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}.bad{fill:#f06292}.good{fill:#7ee787}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#fgbg)"/>
  <text x="32" y="44" class="t" font-size="22">Fragmenta</text>
  <text x="32" y="66" class="m">Mean fragment size of a bench blast · twelve arms, sixteen cases, three ways of splitting the same table</text>

  <rect x="32" y="92" width="150" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">CORPUS</text>
  <text x="46" y="140" class="t" font-size="12">116 published blasts</text>
  <text x="46" y="158" class="m">97 bench blasts, a 14-blast</text>
  <text x="46" y="172" class="m">hold-out, 5 field blasts</text>
  <text x="46" y="192" class="m">16 cases, 6 categories</text>
  <text x="46" y="216" class="warn" font-size="11">source articles never</text>
  <text x="46" y="230" class="warn" font-size="11">redistributed; a guard</text>
  <text x="46" y="244" class="warn" font-size="11">fails on a tracked PDF</text>

  <path d="M182 180 H214" class="acc" fill="none" stroke-width="2" marker-end="url(#fgar)"/>

  <rect x="214" y="80" width="230" height="200" rx="10" class="box"/>
  <text x="230" y="104" class="a" font-size="13">TWELVE ARMS (blastfrag)</text>
  <rect x="230" y="116" width="198" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="134" class="t" font-size="12">6 classical closed forms</text>
  <text x="242" y="150" class="m">Kuznetsov · Kuz-Ram · Swebrec ·</text>
  <text x="242" y="163" class="m">crush-zone · two published fits</text>
  <rect x="230" y="176" width="198" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="242" y="194" class="t" font-size="12">6 learned</text>
  <text x="242" y="210" class="m">LM network · SVR · forest ·</text>
  <text x="242" y="223" class="m">boosting · stack · refit</text>
  <text x="230" y="250" class="m">every arm on every case: a number,</text>
  <text x="230" y="264" class="m">or a refusal naming the missing input</text>

  <path d="M444 180 H476" class="acc" fill="none" stroke-width="2" marker-end="url(#fgar)"/>

  <rect x="476" y="92" width="150" height="176" rx="10" class="box"/>
  <text x="490" y="116" class="a" font-size="13">THREE SPLITS</text>
  <text x="490" y="140" class="t" font-size="12">random</text>
  <text x="490" y="156" class="m">the site memorised</text>
  <text x="490" y="178" class="t" font-size="12">published hold-out</text>
  <text x="490" y="194" class="m">14 blasts, as published</text>
  <text x="490" y="216" class="t" font-size="12">leave one site out</text>
  <text x="490" y="232" class="m">a site never seen:</text>
  <text x="490" y="246" class="m">the honest protocol</text>

  <rect x="640" y="92" width="128" height="176" rx="10" class="box acc"/>
  <text x="654" y="116" class="a" font-size="12">UNSEEN SITE</text>
  <text x="654" y="138" class="m">best learned arm</text>
  <text x="654" y="154" class="bad" font-size="12">-0.034</text>
  <text x="654" y="168" class="m">null model -0.216</text>
  <text x="654" y="190" class="m">fixed coefficients:</text>
  <text x="654" y="206" class="good" font-size="12">regression 0.802</text>
  <text x="654" y="222" class="good" font-size="12">Kuznetsov 0.311</text>
  <text x="654" y="246" class="m">the only positives</text>

  <text x="32" y="316" class="m">Kill criterion, written before the run: a positive score AND a 0.10 margin. It fired; the learned arms are not skill on a site they have not seen.</text>
  <text x="32" y="332" class="m">The classical arm improves under the honest protocol, from negative on a random split, because it has nothing to overfit.</text>
  <text x="32" y="356" class="m">Reproducibility as measured: byte-identical within an environment, better than 3e-08 relative across operating systems, both gated in CI.</text>
  <text x="32" y="380" class="warn" font-size="12">Engine blastfrag on PyPI from its own repository; the product declares no package. Lifecycle building. Part of the Faena hub.</text>
</svg>
