<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img"
     aria-label="CareerTwin: confirmed evidence feeds a deterministic match score with coverage and uncertainty, gaps become recommendations and grounded drafts, and a bounded agent may only propose writes the seeker approves">
  <defs>
    <linearGradient id="ctbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="ctar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#29B6F6"/></marker>
    <style>
      text{font-family:'Segoe UI',system-ui,sans-serif;fill:#c9d1d9}
      .t{fill:#e6edf3;font-weight:600}.a{fill:#29B6F6}.m{fill:#8b949e;font-size:11px}
      .box{fill:#161b22;stroke:#30363d;stroke-width:1}.acc{stroke:#29B6F6}.warn{fill:#e0a030}
    </style>
  </defs>
  <rect width="800" height="400" fill="url(#ctbg)"/>
  <text x="32" y="44" class="t" font-size="22">CareerTwin</text>
  <text x="32" y="66" class="m">One seeker, one evidence-centred profile · the score is an alignment measure, never a hiring probability</text>

  <rect x="32" y="92" width="160" height="176" rx="10" class="box acc"/>
  <text x="46" y="116" class="a" font-size="13">EVIDENCE</text>
  <text x="46" y="140" class="t" font-size="12">Confirmed claims</text>
  <text x="46" y="158" class="m">documents, GitHub</text>
  <text x="46" y="172" class="m">snapshots, STAR bank,</text>
  <text x="46" y="186" class="m">source-linked claims,</text>
  <text x="46" y="200" class="m">confirmation inbox</text>
  <text x="46" y="220" class="m">encrypted at rest,</text>
  <text x="46" y="234" class="m">never in the public repo</text>
  <text x="46" y="256" class="warn" font-size="11">nothing enters unconfirmed</text>

  <path d="M192 180 H224" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="224" y="80" width="236" height="200" rx="10" class="box"/>
  <text x="240" y="104" class="a" font-size="13">DETERMINISTIC MATCH</text>
  <rect x="240" y="116" width="204" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="134" class="t" font-size="12">required · preferred · eligibility</text>
  <text x="252" y="150" class="m">kept apart, never blended</text>
  <rect x="240" y="168" width="204" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="186" class="t" font-size="12">coverage + uncertainty bounds</text>
  <text x="252" y="202" class="m">versioned input digest</text>
  <rect x="240" y="220" width="204" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="252" y="238" class="t" font-size="12">reproducible explanations</text>
  <text x="252" y="254" class="m">lowest-supported component first</text>

  <path d="M460 180 H492" class="acc" fill="none" stroke-width="2" marker-end="url(#ctar)"/>

  <rect x="492" y="92" width="140" height="176" rx="10" class="box"/>
  <text x="506" y="116" class="a" font-size="13">ACTION</text>
  <text x="506" y="140" class="t" font-size="12">Gaps, ranked</text>
  <text x="506" y="158" class="m">evidence · capability ·</text>
  <text x="506" y="174" class="m">presentation</text>
  <text x="506" y="198" class="t" font-size="12">Grounded drafts</text>
  <text x="506" y="216" class="m">resume, cover letter,</text>
  <text x="506" y="232" class="m">interview, follow-up</text>
  <text x="506" y="256" class="m">board · tasks · calendar</text>

  <rect x="646" y="92" width="122" height="176" rx="10" class="box acc"/>
  <text x="660" y="116" class="a" font-size="12">AGENT</text>
  <text x="660" y="138" class="m">bounded, evidence-</text>
  <text x="660" y="154" class="m">cited workflows</text>
  <text x="660" y="178" class="t" font-size="12">proposes only</text>
  <text x="660" y="196" class="t" font-size="12">the seeker</text>
  <text x="660" y="214" class="t" font-size="12">approves</text>
  <text x="660" y="240" class="m">runs fully with</text>
  <text x="660" y="256" class="m">no provider at all</text>

  <text x="32" y="320" class="m">Not done, by design: ranking candidates for employers · inferring protected traits · scraping unrestricted job sites · auto-apply · outreach.</text>
  <text x="32" y="340" class="m">v0.14.5 live on one VPS: 82 backend tests, 6 agent contracts, 22 frontend tests, CodeQL, SBOM, 8.059 ms p95 against a 2.5 s load contract.</text>
  <text x="32" y="360" class="m">Open, by name: ESCO 1.2.1 activation (#55) and a product-scoped model key with a real agent and voice smoke (#63). No external outcome claimed.</text>
</svg>
